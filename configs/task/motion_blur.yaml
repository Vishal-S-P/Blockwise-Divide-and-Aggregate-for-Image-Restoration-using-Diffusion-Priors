# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  consensus_admm_config:
    num_particles: 4
    rho: 5.0
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    inner_iters: 8
    admm_iters: 5

  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 96
    lr: 3.69e-5
    tau: 0.01
    lr_min_ratio: 0.01
    momentum: 0.11
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.05

# latent diffusion model
ldm: 
  mcmc_sampler_config: 
    num_steps: 49
    lr: 2.4e-5 
    tau: 0.01
    lr_min_ratio: 0.041
    momentum: 0.45
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.05

# stable diffusion 
sd: 
  mcmc_sampler_config: 
    num_steps: 30
    lr: 2e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.85
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.01