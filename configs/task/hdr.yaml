# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 2e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  consensus_admm_config:
    num_particles: 4
    rho: 5.0
    lr: 2e-5
    tau: 0.01
    lr_min_ratio: 0.01
    inner_iters: 200
    admm_iters: 5
    beta: 0.2
    huber_delta: 0.1
    huber_iters: 5

  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 2.18e-5
    tau: 0.01
    lr_min_ratio: 0.013
    momentum: 0.23
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.05

# latent diffusion model
ldm: 
  mcmc_sampler_config: 
    num_steps: 38
    lr: 4.52e-06
    tau: 0.01
    lr_min_ratio: 0.015
    momentum: 0.58
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.05

# stable diffusion
sd: 
  mcmc_sampler_config: 
    num_steps: 45
    lr: 1.0e-05
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.7
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.01

