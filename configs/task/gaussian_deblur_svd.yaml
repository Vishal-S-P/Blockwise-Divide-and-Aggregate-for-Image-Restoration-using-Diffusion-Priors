# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 1e-4
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  consensus_admm_config:
    num_particles: 4
    rho: 5.0
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 0.01
    inner_iters: 8
    admm_iters: 5

  operator:
    name: gaussian_deblur_svd
    sigma_y: 0.05
    sigma: 3.0
    channels: 3
    img_dim: 256
    device: cuda
    ZERO: 3e-1

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 82
    lr: 4.04e-5
    tau: 0.01
    lr_min_ratio: 0.011
    momentum: 0.10
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
    sigma: 0.05

# latent diffusion model
ldm: 
  mcmc_sampler_config: 
    num_steps: 35
    lr: 2.70e-6
    tau: 0.01
    lr_min_ratio: 0.95
    momentum: 0.95
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
    sigma: 0.05

# stable diffusion
sd: 
  mcmc_sampler_config: 
    num_steps: 40
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.9
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
    sigma: 0.01

