# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 1e-4
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  consensus_admm_config:
    num_particles: 4
    rho: 5.0
    lr: 1e-4
    tau: 0.01
    lr_min_ratio: 0.01
    inner_iters: 8
    admm_iters: 5

  operator:
    name: inpainting_svd
    channels: 3
    img_dim: 256
    corr_type: random
    corr_ratio: 0.7
    device: cuda
    sigma_y: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 11
    lr: 3.56e-5
    tau: 0.01
    lr_min_ratio: 0.015
    momentum: 0.80
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: inpainting
    mask_type: random  
    mask_prob_range: [ 0.70, 0.71 ]  # for random
    resolution: 256
    sigma: 0.05

# latent diffusion model
ldm: 
  mcmc_sampler_config: 
    num_steps: 38
    lr: 8.40e-6
    tau: 0.01
    lr_min_ratio: 0.013
    momentum: 0.92
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: inpainting
    mask_type: random  
    mask_prob_range: [ 0.70, 0.71 ]  # for random
    resolution: 256
    sigma: 0.05

# stable diffusion 
sd: 
  mcmc_sampler_config: 
    num_steps: 15
    lr: 3e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.60
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: inpainting
    mask_type: random  
    mask_prob_range: [ 0.70, 0.71 ]  # for random
    resolution: 256
    sigma: 0.01