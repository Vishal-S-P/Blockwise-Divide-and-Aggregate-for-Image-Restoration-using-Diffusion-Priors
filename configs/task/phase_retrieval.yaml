# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  consensus_admm_config:
    num_particles: 4
    rho: 1.0
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    inner_iters: 125
    admm_iters: 10
    beta: 0.25
    huber_delta: 0.5
    huber_iters: 20

  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 62
    lr: 9.75e-6
    tau: 0.01
    lr_min_ratio: 0.019
    momentum: 0.73
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.05

# latent diffusion model
ldm: 
  mcmc_sampler_config: 
    num_steps: 65
    lr: 2.1e-5
    tau: 0.01
    lr_min_ratio: 0.12
    momentum: 0.41
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.05

# stable diffusion 
sd: 
  mcmc_sampler_config: 
    num_steps: 95
    lr: 1.10e-4
    tau: 0.01
    lr_min_ratio: 0.027
    momentum: 0.47
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.01